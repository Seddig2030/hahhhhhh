name: Build WalkLearn APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Create Python environment & Install Buildozer
        run: |
          python3 -m venv "$HOME/buildozer-venv"
          source "$HOME/buildozer-venv/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.37

      - name: Build APK with Buildozer
        run: |
          source "$HOME/buildozer-venv/bin/activate"
          # إجبار قبول جميع تراخيص أندرويد تلقائياً أثناء البناء
          yes | buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WalkLearn-APK
          path: bin/*.apk
          if-no-files-found: error
